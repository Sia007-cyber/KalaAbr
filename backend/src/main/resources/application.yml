spring:
  application:
    name: kalaabr-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/kalaabr
    username: kalaabr
    password: kalaabr
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # با Flyway مدیریت می‌شه، Hibernate هرگز اسکیما رو خودش تغییر نده
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    com.kalaabr: DEBUG
