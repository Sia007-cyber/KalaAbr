spring:
  application:
    name: kalaabr-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/kalaabr
    username: kalaabr
    password: kalaabr
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # با Flyway مدیریت می‌شه، Hibernate هرگز اسکیما رو خودش تغییر نده
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# CORS: فقط مسیرهای /api/** را برای دامنه‌های زیر باز می‌کند.
# وقتی دامنه production یا origin های جدید اضافه شد، اینجا ویرایش کنید.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

  jwt:
    # فقط برای توسعه؛ در production روی یک متغیر محیطی معادل بنویسید (≥ 32 بایت برای HS256)
    secret: change-me-in-production-at-least-32-bytes-secret
    expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    com.kalaabr: DEBUG
